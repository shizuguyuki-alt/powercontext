[project]
name = "learning-assistant"
version = "0.1.0"
description = "基于 PowerContext 的自适应学习助手"
requires-python = ">=3.11"
dependencies = [
    "powercontext[server,client,seekdb]>=1.5.0",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
learn = "learning_assistant.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_assistant"]
