version: "3.9"

services:
  powercontext:
    image: python:3.12-slim
    container_name: pc-server
    command: >
      bash -c "
        pip install --no-cache-dir 'powercontext[cli,server,seekdb]' &&
        powercontext server run --host 0.0.0.0 --port 8000
      "
    environment:
      POWERCONTEXT_SERVER_DATABASE_KIND: seekdb
      POWERCONTEXT_SERVER_HTTP_HOST: "0.0.0.0"
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
      POWERCONTEXT_SERVER_LOGGING_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - pc-data:/root/.powercontext
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: seekdb requires Linux. On Windows/macOS, use SQLite instead:
    #   POWERCONTEXT_SERVER_DATABASE_KIND: sqlite

  game:
    build: .
    container_name: life-sim-game
    environment:
      PC_SERVER_URL: http://powercontext:8000
      PC_API_TOKEN: ""
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      powercontext:
        condition: service_healthy

volumes:
  pc-data:
